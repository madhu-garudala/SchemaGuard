services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: schema_guard
      POSTGRES_PASSWORD: schema_guard
      POSTGRES_DB: schema_guard
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - schema_guard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schema_guard"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  schema_guard_pg:
